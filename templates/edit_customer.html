<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Customer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<header>
    <h1>Edit Customer</h1>
</header>

<main>

    <section>

        <h2>Update Customer</h2>

        <form
    action="{{ url_for('edit_customer', customer_id=customer.id) }}"
    method="post"
>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="name">Customer name *</label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ customer.name }}"
                required
                minlength="2"
                maxlength="100"
            >

            <label for="phone">Phone number</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                value="{{ customer.phone or '' }}"
                maxlength="20"
            >

            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ customer.email or '' }}"
                maxlength="100"
            >

            <button type="submit">
                Save Changes
            </button>

            <a href="{{ url_for('dashboard') }}">
                Cancel
            </a>

        </form>

    </section>

</main>

</body>
</html>
